# Perfil "postgres": reactiva la autoconfiguracion de JDBC (deshabilitada por
# defecto en application.properties) y apunta a una base de datos PostgreSQL.
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blueprints}
spring.datasource.username=${DB_USER:blueprints}
spring.datasource.password=${DB_PASSWORD:blueprints}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ejecuta schema.sql en cada arranque (las sentencias usan IF NOT EXISTS, es idempotente)
spring.sql.init.mode=always
