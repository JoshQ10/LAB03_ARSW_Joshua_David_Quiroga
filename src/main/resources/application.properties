spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Sin datasource configurado, el perfil por defecto usa persistencia en memoria
# (InMemoryBlueprintPersistence). Se desactiva la autoconfiguracion de JDBC para
# evitar que Spring Boot intente crear un DataSource cuando no hay uno definido.
# El perfil "postgres" (application-postgres.properties) reactiva estas
# autoconfiguraciones para usar PostgresBlueprintPersistence.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# Actuator: expone health/info/metrics para observabilidad basica (bonus del laboratorio)
management.endpoints.web.exposure.include=health,info,metrics
